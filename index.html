<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/assets/re-do logo/icon_192.png" />
    <link rel="manifest" href="/public/manifest.json">
    <link rel="shortcut icon" href="/assets/re-do logo/icon_192.png" type="image/x-icon">
    <title>NYC Ledger</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Import the scanReceipt helper module and expose a safe helper to POST to the API -->
    <script type="module">
      import scanReceipt from '/src/scanReceipt.ts';
      // Expose for non-module code (e.g. inline handlers or debug console)
      window.scanReceipt = scanReceipt;

      // Example helper to POST FormData to the server and safely parse JSON
      window.postReceipt = async function postReceipt(formData) {
        const response = await fetch('/api/scan-receipt', {
          method: 'POST',
          body: formData,
        });

        // Read text first so we can provide a clearer error if the server returns invalid JSON
        const text = await response.text();
        if (!text) {
          throw new Error('Server returned an empty response.');
        }

        let data;
        try {
          data = JSON.parse(text);
        } catch (err) {
          console.error('Raw response text was:', text);
          throw new Error('Server response was not valid JSON.');
        }

        if (!response.ok) {
          throw new Error(data?.error || 'Failed to process receipt.');
        }

        return data;
      };
    </script>

    <!-- Register service worker for offline support -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then(reg => console.log('ServiceWorker registered', reg))
            .catch(err => console.error('ServiceWorker registration failed', err));
        });
      }
    </script>
  </body>
</html>
